name: Firmware Release

on:
  push:
    branches:
      - main
    paths:
      - "main/version.h"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: firmware-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read firmware version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(grep -E '^#define POLAR_DSTAR_VERSION ' main/version.h | sed -E 's/.*"([^"]+)".*/\1/')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Polar D-Star version: $VERSION"

      - name: Check whether release already exists
        id: release_check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists; nothing to publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build with ESP-IDF 6.1
        if: steps.release_check.outputs.exists != 'true'
        run: |
          docker run --rm \
            -v "$PWD:/project" \
            -w /project \
            espressif/idf:v6.1 \
            bash -lc "python3 tools/generate_web_assets.py && idf.py set-target esp32s3 && idf.py build"

      - name: Prepare release assets
        if: steps.release_check.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/polar_dstar_esp32.bin dist/
          cp build/bootloader/bootloader.bin dist/
          cp build/partition_table/partition-table.bin dist/
          if [ -f build/ota_data_initial.bin ]; then
            cp build/ota_data_initial.bin dist/
          fi

          sha256sum dist/*.bin > dist/SHA256SUMS.txt

          VERSION="${{ steps.version.outputs.version }}"
          SHA256="$(sha256sum dist/polar_dstar_esp32.bin | awk '{print $1}')"
          SIZE="$(stat -c%s dist/polar_dstar_esp32.bin)"

          cat > dist/latest.json <<EOF
          {
            "version": "${VERSION}",
            "target": "esp32s3",
            "idf": "6.1",
            "size": ${SIZE},
            "sha256": "${SHA256}",
            "firmware": "https://github.com/cleziotc/esp32-d-star/releases/latest/download/polar_dstar_esp32.bin"
          }
          EOF

      - name: Publish GitHub Release
        if: steps.release_check.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Polar D-Star ${{ steps.version.outputs.tag }}
          make_latest: true
          generate_release_notes: true
          files: |
            dist/polar_dstar_esp32.bin
            dist/bootloader.bin
            dist/partition-table.bin
            dist/ota_data_initial.bin
            dist/SHA256SUMS.txt
            dist/latest.json
